name: Build Windows DLL

on: [push, pull_request]

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        platform: [x64]

    steps:
      - name: Checkout Megasource
        uses: actions/checkout@v4

      - name: Checkout Custom LÖVE
        uses: actions/checkout@v4
        with:
          repository: YOUR_USERNAME/love
          path: libs/love
          ref: main  # Change to your LÖVE branch or tag

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A ${{ matrix.platform }}

      - name: Build Shared Library (love.dll)
        run: |
          cmake --build build --config Release --target love_shared -j2

      - name: Upload DLL Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: love-windows-dll-${{ matrix.platform }}
          path: |
            build/Release/*.dll
            build/bin/Release/*.dll
            build/libs/love/Release/*.dll