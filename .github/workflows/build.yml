name: Build Windows DLL

on: [push, pull_request]

jobs:
  build-windows:
    runs-on: windows-latest

    strategy:
      matrix:
        platform: [x64]

    steps:
      - name: Checkout Megasource
        uses: actions/checkout@v4

      - name: Checkout Custom LÖVE
        uses: actions/checkout@v4
        with:
          repository: johnfkennedyactualrealofficial/love
          path: libs/love
          ref: 11.x  # Change to your LÖVE branch or tag

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake 3.29
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.29.x'

      - name: Configure CMake
        run: |
          cmake -B build -S .

      - name: Build Shared Library (love.dll)
        run: |
          cmake --build build --config Release --target love_shared

      - name: Upload DLL Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: love-windows-dll-${{ matrix.platform }}
          path: |
            build/Release/*.dll
            build/bin/Release/*.dll
            build/libs/love/Release/*.dll
